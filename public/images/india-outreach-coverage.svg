<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#F1F5F9" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="500"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="240" y1="0" x2="240" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="560" y1="0" x2="560" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
    <line x1="720" y1="0" x2="720" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Left: India & Maharashtra State Node Highlight -->
  <g transform="translate(60, 60)">
    <!-- Main Focus Card: Maharashtra Jurisdiction -->
    <rect width="320" height="380" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header -->
    <rect width="320" height="48" rx="12" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="0" y="36" width="320" height="12" fill="#FAFAFA"/>
    <circle cx="24" cy="24" r="5" fill="#E11D48"/>
    <text x="38" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0F172A" letter-spacing="0.5">CURRENT PRODUCTION DATASET</text>

    <!-- State Title Banner -->
    <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Maharashtra State</text>
    <text x="24" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748B">Higher Education Outreach Matrix</text>

    <!-- Key Node Chips -->
    <g transform="translate(24, 126)">
      <!-- Pune -->
      <rect width="272" height="44" rx="8" fill="#FFF1F2" stroke="#FECDD3" stroke-width="1"/>
      <circle cx="20" cy="22" r="6" fill="#E11D48"/>
      <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Pune Academic Cluster</text>
      <text x="220" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#BE123C">722 Col.</text>

      <!-- Mumbai -->
      <g transform="translate(0, 54)">
        <rect width="272" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="20" cy="22" r="6" fill="#0F172A"/>
        <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Mumbai Metropolitan</text>
        <text x="220" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#64748B">392 Col.</text>
      </g>

      <!-- Nagpur & Rest of State -->
      <g transform="translate(0, 108)">
        <rect width="272" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <circle cx="20" cy="22" r="6" fill="#15803D"/>
        <text x="36" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#0F172A">Nagpur, Nashik &amp; Districts</text>
        <text x="210" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#15803D">4,375 Col.</text>
      </g>

      <!-- Status Footer inside card -->
      <g transform="translate(0, 168)">
        <rect width="272" height="34" rx="6" fill="#F1F5F9"/>
        <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#475569">Active Master Records: 5,489 Enriched</text>
      </g>
    </g>
  </g>

  <!-- Right: Future Pan-India Expansion Map Schematic -->
  <g transform="translate(420, 60)">
    <rect width="320" height="380" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Header -->
    <rect width="320" height="48" rx="12" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="0" y="36" width="320" height="12" fill="#FAFAFA"/>
    <circle cx="24" cy="24" r="5" fill="#3B82F6"/>
    <text x="38" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0F172A" letter-spacing="0.5">FUTURE EXPANSION ROADMAP</text>

    <text x="24" y="86" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Pan-India Architecture</text>
    <text x="24" y="106" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748B">Engine ready for all Indian States &amp; UTs</text>

    <!-- Grid of upcoming states -->
    <g transform="translate(24, 126)">
      <!-- Tamil Nadu -->
      <rect width="272" height="40" rx="6" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
      <text x="14" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#334155">Tamil Nadu (Anna Univ, Chennai, CBE)</text>
      <text x="225" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#0284C7">Q3 2026</text>

      <!-- Karnataka -->
      <g transform="translate(0, 48)">
        <rect width="272" height="40" rx="6" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
        <text x="14" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#334155">Karnataka (VTU, Bangalore Tech)</text>
        <text x="225" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#0284C7">Q3 2026</text>
      </g>

      <!-- Delhi NCR & Northern Hub -->
      <g transform="translate(0, 96)">
        <rect width="272" height="40" rx="6" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
        <text x="14" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#334155">Delhi NCR &amp; North Universities</text>
        <text x="225" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#0284C7">Q4 2026</text>
      </g>

      <!-- Telangana & AP -->
      <g transform="translate(0, 144)">
        <rect width="272" height="40" rx="6" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1"/>
        <text x="14" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#334155">Telangana &amp; Andhra Pradesh</text>
        <text x="225" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#0284C7">Q4 2026</text>
      </g>
    </g>
  </g>
</svg>
